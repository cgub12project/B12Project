# ============================================================
# Alembic migration config
# NOTE: this file is parsed with the OS locale encoding by
# configparser, so comments here must stay ASCII-only.
# The real DATABASE_URL is injected from .env by alembic/env.py;
# the sqlalchemy.url below is only a placeholder.
# ============================================================

[alembic]
# migration scripts directory
script_location = alembic

# add the project root (current dir) to sys.path so `import app` works
# when alembic is invoked as a console script (alembic.exe)
prepend_sys_path = .

# migration file name template: date + revision + slug
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# placeholder (see alembic/env.py)
sqlalchemy.url = mysql+aiomysql://placeholder/placeholder

timezone = Asia/Taipei

[post_write_hooks]

# ----- logging -----
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
